<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Simple Ordering System — Dashboard</title>
    <!-- Bootstrap CSS for rapid, professional styling -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Bootstrap Icons -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css">
    <!-- App styles -->
    <link href="/static/css/styles.css" rel="stylesheet">
  </head>
  <body>
    <div class="d-flex" id="wrapper">
      <!-- Sidebar -->
      <aside class="border-end bg-white" id="sidebar-wrapper">
        <div class="sidebar-heading px-3 py-4">SimpleOrder</div>
        <div class="list-group list-group-flush">
          <a href="#" class="list-group-item list-group-item-action active" data-nav="dashboard">Dashboard</a>
        </div>
      </aside>

      <!-- Page content -->
      <div id="page-content-wrapper" class="w-100">
        <nav class="navbar navbar-expand-lg navbar-light bg-white border-bottom">
          <div class="container-fluid">
            <button class="btn btn-sm btn-outline-secondary" id="menu-toggle">☰</button>
            <div class="ms-auto d-flex align-items-center gap-3">
              <div class="fw-semibold">Dashboard</div>
            </div>
          </div>
        </nav>

        <div class="container-fluid p-4" id="main-panel">
          <!-- Top cards -->
          <div class="row g-3 mb-4" id="dashboard-section">
            <div class="col-sm-6 col-md-3">
              <div class="card hover-card">
                <div class="card-body">
                  <h6 class="card-subtitle mb-2 text-muted">Total Items</h6>
                  <h3 id="total-items">0</h3>
                </div>
              </div>
            </div>
            <div class="col-sm-6 col-md-3">
              <div class="card hover-card">
                <div class="card-body">
                  <h6 class="card-subtitle mb-2 text-muted">Actions</h6>
                  <button class="btn btn-primary" id="open-create">Create Item</button>
                </div>
              </div>
            </div>
          </div>

          <!-- Items list -->
          <section id="items-section">
            <div class="d-flex justify-content-between align-items-center mb-3">
              <h4>Items</h4>
              <input id="search" class="form-control form-control-sm w-auto" placeholder="Search by name..." />
            </div>

            <div id="items-container" class="row g-3">
              <!-- Cards injected here by JS -->
            </div>
          </section>

          <!-- Settings placeholder -->
          <section id="settings-section" class="mt-5 d-none">
            <h4>Settings</h4>
            <p class="text-muted">Theme and preferences can be added here.</p>
          </section>
        </div>
      </div>
    </div>

    <!-- Create / Update Modal -->
    <div class="modal fade" id="itemModal" tabindex="-1" aria-hidden="true">
      <div class="modal-dialog">
        <form id="item-form" class="modal-content">
          <div class="modal-header">
            <h5 class="modal-title" id="itemModalLabel">Create Item</h5>
            <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
          </div>
          <div class="modal-body">
            <input type="hidden" name="_method" value="POST" />
            <div class="mb-3">
              <label class="form-label">ID</label>
              <input name="item_id" class="form-control" required />
            </div>
            <div class="mb-3">
              <label class="form-label">Name</label>
              <input name="name" class="form-control" required />
            </div>
            <div class="mb-3">
              <label class="form-label">Price</label>
              <input name="price" type="number" step="0.01" class="form-control" required />
            </div>
            <div class="mb-3">
              <label class="form-label">Image URL</label>
              <input name="image_url" class="form-control" />
            </div>
          </div>
          <div class="modal-footer">
            <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancel</button>
            <button type="submit" class="btn btn-primary" id="save-item">Save</button>
          </div>
        </form>
      </div>
    </div>

    <!-- Confirmation Modal -->
    <div class="modal fade" id="confirmModal" tabindex="-1" aria-hidden="true">
      <div class="modal-dialog modal-sm">
        <div class="modal-content">
          <div class="modal-body py-4 text-center">
            <p id="confirmText">Are you sure?</p>
            <div class="d-flex justify-content-center gap-2">
              <button class="btn btn-secondary" data-bs-dismiss="modal">Cancel</button>
              <button id="confirmYes" class="btn btn-danger">Delete</button>
            </div>
          </div>
        </div>
      </div>
    </div>

    <!-- Bootstrap JS bundle -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    <!-- App JS -->
    <script src="/static/js/app.js"></script>
  </body>
</html>
